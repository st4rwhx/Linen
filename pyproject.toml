[project]
name = "linen"
version = "0.1.0"
description = "Roblox R15/R6 animation from FreeMoCap captures and from text prompts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
linen = "linen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["linen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
